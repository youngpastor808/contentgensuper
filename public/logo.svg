<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Master Brand Gradients -->
    <linearGradient id="logo-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="logo-aperture-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="logo-aperture-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <linearGradient id="logo-aperture-3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="logo-orb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="logo-play-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <linearGradient id="logo-gen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="logo-ai-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.3" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#EC4899" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- LEFT EMBLEM: Cinematic Aperture & Lens Core -->
  <g transform="translate(100, 100)" filter="url(#logo-glow)">
    <!-- Outer Precision Focus Ring -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#logo-accent-grad)" stroke-width="2.5" stroke-opacity="0.9" />
    
    <!-- Outer Ring Tick Marks -->
    <circle cx="0" cy="0" r="84" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="3 9" stroke-opacity="0.4" />

    <!-- Dark Lens Basin -->
    <circle cx="0" cy="0" r="74" fill="#0B0F19" stroke="#1F2937" stroke-width="1" />

    <!-- Cinematic Aperture Blades (Curved overlapping geometric polygons) -->
    <g opacity="0.85">
      <path d="M 0 -68 C 22 -68 54 -40 56 -18 L 22 -6 C 20 -20 8 -36 -4 -42 Z" fill="url(#logo-aperture-1)" />
      <path d="M 56 -18 C 58 4 44 48 24 58 L 10 24 C 22 18 28 6 26 -8 Z" fill="url(#logo-aperture-2)" />
      <path d="M 24 58 C 4 68 -42 54 -54 36 L -20 18 C -14 28 0 34 12 28 Z" fill="url(#logo-aperture-3)" />
      <path d="M -54 36 C -66 18 -60 -28 -44 -46 L -16 -16 C -26 -6 -28 8 -22 20 Z" fill="url(#logo-aperture-1)" />
      <path d="M -44 -46 C -28 -64 0 -68 18 -64 L 6 -28 C -4 -30 -16 -24 -24 -14 Z" fill="url(#logo-aperture-2)" />
    </g>

    <!-- Center Lens Core -->
    <circle cx="0" cy="0" r="42" fill="url(#logo-orb-grad)" stroke="url(#logo-accent-grad)" stroke-width="2" />

    <!-- Sleek Play Symbol (Centered) -->
    <path d="M -8 -16 C -8 -17.5 -6.4 -18.4 -5 -17.6 L 16 -5.6 C 17.3 -4.8 17.3 -2.9 16 -2.1 L -5 9.9 C -6.4 10.7 -8 9.8 -8 8.3 Z" fill="url(#logo-play-grad)" />

    <!-- Upper Sparkle Highlight -->
    <path d="M 48 -48 Q 48 -34 62 -34 Q 48 -34 48 -20 Q 48 -34 34 -34 Q 48 -34 48 -48 Z" fill="#38BDF8" opacity="0.9" />
  </g>

  <!-- RIGHT TYPOGRAPHY: ContentGen + AI Pill -->
  <g transform="translate(205, 126)">
    <!-- "Content" in Crisp Pure Display Font -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="68" fill="#F8FAFC" letter-spacing="-1.5">Content</text>

    <!-- "Gen" in Vibrant Gradient Display Font -->
    <text x="256" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="68" fill="url(#logo-gen-grad)" letter-spacing="-1.5">Gen</text>

    <!-- Sleek Glassmorphic "AI" Studio Badge -->
    <g transform="translate(405, -58)" filter="url(#badge-glow)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="88" height="58" rx="14" fill="url(#logo-ai-badge-bg)" />
      <rect x="0.75" y="0.75" width="86.5" height="56.5" rx="13.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
      <!-- AI Typography -->
      <text x="44" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">AI</text>
    </g>
  </g>
</svg>
